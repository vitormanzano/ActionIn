name: ci
run-name: ActionIn CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel previous runs of the same branch/PR if a new push arrives
# before the current run finishes – saves Actions minutes.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend/ActionIn/
    steps:
      - uses: actions/checkout@v6
      - name: Setup dotnet 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/backend/ActionIn/global.json
      - name: Install dependencies
        run: dotnet restore ActionIn.slnx
      - name: Build
        run: dotnet build --no-restore -warnaserror
      - name: Test with the dotnet CLI
        run: dotnet test --no-build
